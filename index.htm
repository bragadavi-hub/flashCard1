<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Óptica - Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Flashcards: Física Óptica</h1>
        <a href="#" class="nav-home">Home</a>
    </header>

    <main class="content-area">
        <h2>Clique no cartão para revelar a resposta</h2>
        
        <section class="card-section">
            <div class="flip-card" onclick="virarCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <p id="pergunta">Carregando...</p>
                    </div>
                    <div class="card-back">
                        <p id="resposta" class="hidden">Carregando...</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="action-box">
            <button class="next-btn" onclick="proximoCard(event)">Próximo Card</button>
        </div>
    </main>

    <footer class="main-footer">
        <p>Desenvolvido por [Maria Zanzarini]</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
